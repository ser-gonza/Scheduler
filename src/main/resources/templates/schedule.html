<!-- Display current plan and allows reset/removal/submit -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Your Schedule</title>
    <link rel="stylesheet" th:href="@{/styles.css}">
</head>
<body>

<div class="container">

    <h1>Your Schedule</h1>

    <p><a href="/courses">Back</a></p>

    <table>
        <tr>
            <th>Code</th>
            <th>Title</th>
            <th>Credits</th>
            <th>Time</th>
            <th></th>
        </tr>

        <tr th:each="c : ${schedulePlan.courses}">
            <td th:text="${c.code}"></td>
            <td th:text="${c.title}"></td>
            <td th:text="${c.credits}"></td>
            <td th:text="${c.timeslot}"></td>
            <td>
                <form method="post" action="/schedule/remove">
                    <input type="hidden" name="courseId" th:value="${c.id}">
                    <button type="submit">Remove</button>
                </form>
            </td>
        </tr>
    </table>

    <form method="post" action="/schedule/reset">
        <button type="submit">Reset Plan</button>
    </form>

    <form method="post" action="/schedule/submit">
        <button type="submit">Submit Schedule</button>
    </form>

</div>

</body>
</html>
